<div class="user-projects">
  <div class="user">
    <div class="tech">
      <p>Please, feel free to leave me a message.</p>
      
      <!-- Contact Form -->
      <div class="form-frame">

        <div class="form-frame">
  <!-- 1. Turnstile Script -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <!-- 2. HTML Form -->
  <form id="contactForm">
    <p><input class="form-control" type="email" id="formEmail" name="email" placeholder="Your email" required></p>
    <p><input class="form-control" type="text" id="formName" name="name" placeholder="Your Name" required></p>
    <p><textarea class="form-control" id="formMessage" name="message" placeholder="Your message" required minlength="5"></textarea></p>
    
    <!-- Turnstile Anti-Spam Widget -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFGg2_7tHFfQcnnx"></div>

    <p><button type="submit" id="submitBtn"><i class="fa fa-paper-plane"></i> Send</button></p>
    
    <!-- Success / Error Message Box -->
    <div id="formStatus" style="display:none; margin-top:10px;"></div>
  </form>

  <!-- 3. Form Submission Handling Script -->
  <script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('formStatus');
      
      const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]');
      const turnstileToken = turnstileResponse ? turnstileResponse.value : '';

      if (!turnstileToken) {
        status.style.color = '#f44336';
        status.innerText = '❌ Please complete the anti-spam verification.';
        status.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = 'Sending...';

      const payload = {
        name: document.getElementById('formName').value,
        email: document.getElementById('formEmail').value,
        message: document.getElementById('formMessage').value,
        turnstileToken: turnstileToken
      };

      try {
        const response = await fetch('https://dulaj-contact-form.dulajc.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok) {
          status.style.color = '#4CAF50';
          status.innerText = '✨ Thank you! Your message has been sent successfully.';
          status.style.display = 'block';
          document.getElementById('contactForm').reset();
          if (window.turnstile) turnstile.reset();
        } else {
          throw new Error(result.error || 'Something went wrong.');
        }
      } catch (err) {
        status.style.color = '#f44336';
        status.innerText = '❌ ' + err.message;
        status.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-paper-plane"></i> Send';
      }
    });
  </script>
</div>
