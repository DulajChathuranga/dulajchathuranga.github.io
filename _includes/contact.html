    font-size: 14px;
  }

  #contactForm textarea
  {
    height: 7em;
    resize: vertical;
  }

  .form-frame
  {
    border-radius: 5px;
    background-color: #f2f2f2;
    padding: 20px;
    box-sizing: border-box;
  }

  #submitBtn
  {
    cursor: pointer;
    border: 1px solid #1a222c;
    border-radius: 4px;
    color: #1a222c;
    background-color: transparent;
    padding: 10px 24px;
    font-size: 15px;
    transition: all 0.3s ease;
  }

  #submitBtn:hover

  /* Success Card Styling (Option 3) */
  .success-card
  {
    text-align: center;
    padding: 25px 15px;
  }

  .success-card .icon
  {
    font-size: 40px;
    color: #4CAF50;
    margin-bottom: 10px;
  }

  .success-card h3
  {
    margin: 10px 0 5px 0;

  }

  .success-card p
  {

  }

  .send-another-btn
  {
    background: none;
    border: none;
    color: #54516a;
    text-decoration: underline;
    cursor: pointer;
    font-size: 13px;
    padding: 5px;
  }

  .send-another-btn:hover
  {
    color: #1a222c;
  }

  /* Inline Error Banner */
  #errorStatus
  {
    display: none;
    background-color: #ffebee;
    color: #c62828;
    border: 1px solid #ef9a9a;
    border-radius: 4px;
    padding: 10px;
    margin-top: 12px;
    font-size: 13px;
    width: 90%;
    box-sizing: border-box;
  }

  .up
  {
    font-size: 20px;
    color: #1a222c;
    padding: 0em 0.25em 0em 0.25em;
    margin-bottom: 1em;
    border: 1px solid #1a222c;
    border-radius: 4px;
  }

  .up:hover
  {
    background-color: #54516a;
    color: #fff;
    border-color: #54516a;
  }

  <! New Form Style>

/* 1. Center the form frame container and its text contents */
  .form-frame {
    border-radius: 5px;
    background-color: #f2f2f2;
    padding: 20px;
    box-sizing: border-box;
    text-align: center !important;
    margin: 0 auto !important;
  }

  /* 2. Force input boxes and textareas to block & auto-center */
  #contactForm textarea,
  #contactForm input[type="text"],
  #contactForm input[type="email"] {
    width: 90% !important;
    padding: 12px 20px;
    margin: 8px auto !important; /* 'auto' centers block elements horizontally */
    display: block !important;   /* 'block' allows margin auto to work */
    float: none !important;      /* Prevents theme float rules from forcing left alignment */
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 14px;
  }

  /* 3. Center the Cloudflare Turnstile anti-spam widget */
  .cf-turnstile {
    display: flex !important;
    justify-content: center !important;
    margin: 12px auto !important;
  }

  /* 4. Center the submit button */
  #submitBtn {
    cursor: pointer;
    border: 1px solid #1a222c;
    border-radius: 4px;
    color: #1a222c;
    background-color: transparent;
    padding: 10px 24px;
    font-size: 15px;
    transition: all 0.3s ease;
    display: inline-block !important;
    margin: 10px auto !important;
    float: none !important;
  }

  /* 5. Flexible "Go to Top" Arrow Container */
  .go-to-top-wrapper {
    display: flex !important;
    justify-content: flex-end !important; /* Aligns to right edge of content container */
    max-width: 90% !important;            /* Keeps it nicely aligned with form width */
    margin: 15px auto 0 auto !important;
  }
  
</style>

<div class="user-details">
  <h1> Contact </h1>
</div>

<div class="user-projects">
  <div class="user">
    <div class="tech">
      <p>Please, feel free to leave me a message.</p>
      
      <!-- Contact Form Container -->
      <div class="form-frame">

        <!-- 1. Turnstile Script -->
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

        <!-- 2. HTML Form -->
        <form id="contactForm">
          <p><input type="email" id="formEmail" name="email" placeholder="Your email" required></p>
          <p><input type="text" id="formName" name="name" placeholder="Your Name" required></p>
          <p><textarea id="formMessage" name="message" placeholder="Your message" required minlength="5"></textarea></p>
          
          <!-- Turnstile Anti-Spam Widget -->
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAFGg2_7tHFfQcnnx"></div>

          <p><button type="submit" id="submitBtn"><i class="fa fa-paper-plane"></i> Send</button></p>
          
          <!-- Inline Error Box (Only shown if validation/network fails) -->
          <div id="errorStatus"></div>
        </form>

        <!-- 3. Success State Card (Hidden by default) -->
        <div id="successCard" class="success-card" style="display: none;">
          <div class="icon"><i class="fa fa-check-circle"></i></div>
          <h3>Thank You!</h3>
          <p>Your message has been sent successfully. I'll get back to you soon!</p>
          <button type="button" class="send-another-btn" onclick="resetFormState()">Send another message</button>
        </div>

        <!-- 4. Form Submission Handling Script -->
        <script>
          document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorStatus');
            
            // Clear previous errors
            errorBox.style.display = 'none';
            errorBox.innerText = '';

            const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]');
            const turnstileToken = turnstileResponse ? turnstileResponse.value : '';

            if (!turnstileToken) {
              errorBox.innerText = '❌ Please complete the anti-spam verification.';
              errorBox.style.display = 'block';
              return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Sending...';

            const payload = {
              name: document.getElementById('formName').value,
              email: document.getElementById('formEmail').value,
              message: document.getElementById('formMessage').value,
              turnstileToken: turnstileToken
            };

            try {
              const response = await fetch('https://dulaj-contact-form.dulajc.workers.dev', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });

              const result = await response.json();

              if (response.ok) {
                // Hide Form & Show Success State Card
                document.getElementById('contactForm').style.display = 'none';
                document.getElementById('successCard').style.display = 'block';
                
                // Reset internal form fields
                document.getElementById('contactForm').reset();
                if (window.turnstile) turnstile.reset();
              } else {
                throw new Error(result.error || 'Something went wrong. Please try again.');
              }
            } catch (err) {
              errorBox.innerText = '❌ ' + err.message;
              errorBox.style.display = 'block';
            } finally {
              btn.disabled = false;
              btn.innerHTML = '<i class="fa fa-paper-plane"></i> Send';
            }
          });

          // Function to reset back to form view if user wants to send another
          function resetFormState() {
            document.getElementById('successCard').style.display = 'none';
            document.getElementById('contactForm').style.display = 'block';
          }
        </script>

      </div>
      <!-- FORM END -->
      
    </div>
  </div>
</div>
